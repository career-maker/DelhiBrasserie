<!DOCTYPE html>
<html lang="en-GB" class="{{html_class}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<meta name="theme-color" content="#D61820">
{{robots}}
<meta property="og:type" content="{{og_type}}">
<meta property="og:site_name" content="The Delhi Brasserie">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{og_description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{og_image_abs}}">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png">
{{preload}}
<script>document.documentElement.classList.add('js','pre-on');</script>

<link href="/assets/css/main.min.css?v={{version}}" rel="stylesheet">

<!-- Google Analytics (GA4): paste the existing measurement tag here in consent-gated form:
     <script type="text/plain" data-cookie="analytics" src="..."></script> -->
<!-- Brevo newsletter: paste the existing Brevo subscription form / script here if it is kept. -->
{{schema}}
</head>
<body class="{{body_class}}">
{{> top}}
<main id="main">
{{banner}}
{{content}}
</main>
{{> footer}}
{{> cookie}}
<script src="/assets/js/main.js?v={{version}}" defer></script>
{{scripts}}
</body>
</html>
